[package]
name = "warhammer-companion"
version = "0.1.0"
description = "Local-first Warhammer 40,000 AI game companion"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "warhammer_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
